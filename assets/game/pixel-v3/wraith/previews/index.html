<h1>Wraith — 52 authored keys</h1><p>Exact delivered atlas pixels. Native cell 96×96, anchor [48,84]. Nearest filtering. The four views use authored front/back plus horizontal mirrors.</p>

<script>const meta={"path": "wraith.png", "cell": 96, "columns": 13, "rows": 4, "anchor": [48, 84], "frames": ["front-idle-01", "front-idle-02", "front-idle-03", "front-idle-04", "front-run-01", "front-run-02", "front-run-03", "front-run-04", "front-run-05", "front-run-06", "front-attack-01", "front-attack-02", "front-attack-03", "front-attack-04", "front-attack-05", "front-attack-06", "front-hurt-01", "front-hurt-02", "front-hurt-03", "front-hurt-04", "front-death-01", "front-death-02", "front-death-03", "front-death-04", "front-death-05", "front-death-06", "back-idle-01", "back-idle-02", "back-idle-03", "back-idle-04", "back-run-01", "back-run-02", "back-run-03", "back-run-04", "back-run-05", "back-run-06", "back-attack-01", "back-attack-02", "back-attack-03", "back-attack-04", "back-attack-05", "back-attack-06", "back-hurt-01", "back-hurt-02", "back-hurt-03", "back-hurt-04", "back-death-01", "back-death-02", "back-death-03", "back-death-04", "back-death-05", "back-death-06"], "clips": {"idle": {"front": [0, 1, 2, 3], "back": [26, 27, 28, 29]}, "run": {"front": [4, 5, 6, 7, 8, 9], "back": [30, 31, 32, 33, 34, 35]}, "attack": {"front": [10, 11, 12, 13, 14, 15], "back": [36, 37, 38, 39, 40, 41]}, "hurt": {"front": [16, 17, 18, 19], "back": [42, 43, 44, 45]}, "death": {"front": [20, 21, 22, 23, 24, 25], "back": [46, 47, 48, 49, 50, 51]}}, "filter": "nearest", "mipmaps": false, "timing": {"idle": {"keyTimesMs": [0, 180, 360, 540], "playback": "loop"}, "run": {"keyTimesMs": [0, 90, 180, 270, 360, 450], "playback": "loop"}, "attack": {"keyTimesMs": [0, 400, 800, 890, 1040, 1220], "playback": "one-shot-hold"}, "hurt": {"keyTimesMs": [0, 70, 140, 220], "playback": "one-shot-hold"}, "death": {"keyTimesMs": [0, 120, 270, 420, 640, 820], "playback": "one-shot-hold"}}},variants=[{"id": "wraith", "path": "wraith.png"}],durations={"idle": [180, 180, 180, 180], "run": [90, 90, 90, 90, 90, 90], "attack": [400, 400, 90, 150, 180, 180], "hurt": [70, 70, 80, 100], "death": [120, 150, 150, 220, 180, 240]};const look=document.querySelector('#look'),clip=document.querySelector('#clip'),range=document.querySelector('#frame');let image=null,time=0,last=0,paused=false,revision=0;for(const v of variants)look.add(new Option(v.id,v.path));for(const c of Object.keys(meta.clips))clip.add(new Option(c,c));const views=[['SE','front',false],['SW','front',true],['NE','back',false],['NW','back',true]].map(([label,facing,flip])=>{const figure=document.createElement('figure'),canvas=document.createElement('canvas');canvas.width=canvas.height=96;figure.append(canvas);const caption=document.createElement('figcaption');caption.textContent=label;figure.append(caption);document.querySelector('#views').append(figure);return {ctx:canvas.getContext('2d'),facing,flip}});async function load(){const own=++revision;const next=new Image;next.src='../'+look.value;await next.decode();if(own===revision)image=next;}look.onchange=load;clip.onchange=()=>{time=0;range.value=0;range.max=meta.clips[clip.value].front.length-1};range.oninput=()=>{paused=true;document.querySelector('#pause').textContent='Play'};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause'};function draw(now){if(last&&!paused)time+=Math.min(now-last,100);last=now;const ids=meta.clips[clip.value].front,ms=durations[clip.value]||ids.map(()=>100);let step=Number(range.value);if(!paused){const total=ms.reduce((a,b)=>a+b,0),hold=['idle','run'].includes(clip.value)?0:1000;let cursor=time%(total+hold);step=ms.length-1;for(let i=0;i<ms.length;i++){if(cursor<ms[i]){step=i;break}cursor-=ms[i]}range.value=step;}if(image)for(const v of views){const idx=meta.clips[clip.value][v.facing][step],x=idx%meta.columns*96,y=Math.floor(idx/meta.columns)*96;v.ctx.clearRect(0,0,96,96);v.ctx.save();v.ctx.imageSmoothingEnabled=false;if(v.flip){v.ctx.translate(96,0);v.ctx.scale(-1,1)}v.ctx.drawImage(image,x,y,96,96,0,0,96,96);v.ctx.restore()}document.querySelector('#key').textContent=meta.frames[ids[step]];requestAnimationFrame(draw)}for(const v of variants)if(v.previewPath){const f=document.createElement('figure'),im=new Image,cap=document.createElement('figcaption');im.src='../'+v.previewPath;im.width=im.height=96;cap.textContent=v.id;f.append(im,cap);document.querySelector('#gallery').append(f)}clip.onchange();load();requestAnimationFrame(draw);</script></html>
