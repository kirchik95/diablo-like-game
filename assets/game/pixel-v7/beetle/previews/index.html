erySelector('#pause').textContent=paused?'Play':'Pause'};function draw(now){if(last&&!paused)time+=Math.min(now-last,100);last=now;const ids=meta.clips[clip.value].front,ms=durations[clip.value];let step=Number(range.value);if(!paused){const total=ms.reduce((a,b)=>a+b,0),hold=loops.includes(clip.value)?0:1000;let cursor=time%(total+hold);step=ms.length-1;for(let i=0;i<ms.length;i++){if(cursor<ms[i]){step=i;break}cursor-=ms[i]}range.value=step;}if(image)for(const v of views){const idx=meta.clips[clip.value][v.facing][step],x=idx%meta.columns*C,y=Math.floor(idx/meta.columns)*C;v.ctx.clearRect(0,0,C,C);v.ctx.save();v.ctx.imageSmoothingEnabled=false;if(v.flip){v.ctx.translate(C,0);v.ctx.scale(-1,1)}v.ctx.drawImage(image,x,y,C,C,0,0,C,C);v.ctx.restore();v.ctx.fillStyle='#70a49b';v.ctx.fillRect(meta.anchor[0]-3,meta.anchor[1],7,1)}document.querySelector('#key').textContent=meta.frames[ids[step]];requestAnimationFrame(draw)}for(const c of Object.keys(meta.clips)){const im=new Image;im.src='strip-'+c+'-2x.png';im.alt=c;document.querySelector('#strips').append(im)}clip.onchange();requestAnimationFrame(draw);</script></html>
